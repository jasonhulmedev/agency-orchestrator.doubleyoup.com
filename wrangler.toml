# doubleyoup agency-orchestrator Worker.
#
# Deployed by each AGENCY into their OWN Cloudflare account (pulled from our
# GitHub). Phase 1 = onboarding + credential self-validation only — no
# infrastructure provisioning. Uses only Web APIs (fetch + Web Crypto), so no
# nodejs_compat flag is needed.
#
# CONFIG lives entirely in Cloudflare vars/secrets — NEVER hardcode a secret here.
#
#   [vars] (public, committed):
#     APP_BASE_URL   our control-plane app base (below)
#
#   Secrets (NOT committed — `wrangler secret put <NAME>`; for local `wrangler dev`
#   put them in an untracked .dev.vars — see .dev.vars.example):
#     Direction-A OAuth2 client credentials (issued by our app at onboarding):
#       wrangler secret put DY_CLIENT_ID
#       wrangler secret put DY_CLIENT_SECRET
#     Agency service credentials (the agency's own accounts):
#       wrangler secret put GCP_SERVICE_ACCOUNT_KEY   # the full service-account JSON
#       wrangler secret put S3_ACCESS_KEY_ID
#       wrangler secret put S3_SECRET_ACCESS_KEY
#       wrangler secret put S3_REGION                 # e.g. us-east-1 (or "auto" for R2)
#       wrangler secret put S3_BUCKET
#       wrangler secret put S3_BACKUP_BUCKET          # optional — Tier-1's own UNLOCKED bucket (unset = S3_BUCKET)
#       wrangler secret put S3_ENDPOINT               # optional — set for R2/MinIO/Wasabi
#       wrangler secret put STRIPE_SECRET_KEY
#       wrangler secret put R2_PROVISION_API_TOKEN     # account-owned: Workers R2 Storage: Edit (provision-r2) + Account API Tokens: Edit (hub#43 r2-site-key-install/revoke/state)
#       wrangler secret put CELL_FILE_AGENT_URL        # OPTIONAL fallback (hub#43): the FILE-node cell-agent (set-r2-target). Not needed: the signed r2-site-key-install job names the site's file-node agent, and the job's pair wins
#       wrangler secret put CELL_FILE_AGENT_TOKEN      # OPTIONAL fallback: its bearer token (set both or neither)
#       R2_EXPECTED_ACCOUNT_ID (a var, hub#43 L7): the account id R2_PROVISION_API_TOKEN must belong to; the media ops refuse any other
#       wrangler secret put CF_DNS_API_TOKEN           # Zone:DNS:Edit + Zone:Read (Direction-B dns-record-upsert) + Zone:Cache Purge (cache-purge) + Zone:Cache Rules:Edit (cache-rule-upsert) + Zone WAF:Edit (waf-rule-upsert) + Zone:SSL and Certificates:Edit (hub#46 custom-hostname-*)
#       wrangler secret put CF_CUSTOM_HOSTNAME_ZONE    # hub#46: the agency zone NAME that holds its customers' custom hostnames, e.g. example.com (a secret so a redeploy keeps it)
#       wrangler secret put ANTHROPIC_API_KEY
#       wrangler secret put OPENROUTER_API_KEY
#
# Deploy (needs `wrangler login` against the agency's Cloudflare account):
#   1. npm install
#   2. Set the secrets above (`wrangler secret put ...`).
#   3. npm run deploy      # wrangler deploy
#   4. Hit https://<worker>.workers.dev/validate until every result is green,
#      then POST /complete to signal onboarding done.

name = "agencydoubleyoup"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
APP_BASE_URL = "https://app.doubleyoup.com"

# ── Direction-B replay protection (Durable Object) ───────────────────────────
# NONCE_STORE is the single-use nonce store that makes a signed /actuate job
# actuatable at most once (src/nonce-store.ts). No per-account id is committed:
# `wrangler deploy` auto-provisions the DO in whichever agency account runs it,
# so this file stays identical across every agency deployment.
#
# NOTE: Durable Objects require the Workers PAID plan on the deploying account.
[[durable_objects.bindings]]
name = "NONCE_STORE"
class_name = "NonceStore"

# Applied automatically on `wrangler deploy`. `new_sqlite_classes` makes NonceStore
# a SQLite-backed DO (state.storage.sql), so spent nonces survive DO restarts/evictions.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NonceStore"]
