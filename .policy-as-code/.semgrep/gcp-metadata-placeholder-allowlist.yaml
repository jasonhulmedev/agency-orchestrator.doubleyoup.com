# The metadata placeholder allowlist, pinned to its approved five names.
#
# WHAT THE LIST IS. It is the security boundary of the whole Direction-B credential path. The
# orchestrator renders an agency cell's root boot script with `@@DY_T2_S3_*@@` tokens in place of
# the agency's object-store credential; the agency Worker substitutes its OWN S3_* secrets for
# exactly these names before calling GCP setMetadata, and REFUSES any other `@@...@@` rather than
# passing it through. That refusal is why the platform never holds the agency's R2 key — the
# point of Direction-B and the reason the op is shaped this awkward way instead of the simple one
# (planning/47, "Decisions taken" and §1).
#
# WHAT A SIXTH NAME COSTS. Each entry is one more agency secret the Worker will splice into a
# script Google runs AS ROOT on every boot. planning/47 §1 is explicit that substitution "must be
# allowlisted to a fixed set of known names, and must not be a general template engine — a Worker
# that substitutes arbitrary tokens into a root-run boot script is a far larger surface than the
# one we need." Adding to the list is the one-line edit that turns the first sentence into the
# second, so it should not be able to pass review unnoticed.
#
# WHY A PINNED LITERAL. The names carry no property a matcher can test — the approved list IS the
# policy. The rule holds a copy and flags every other value, so changing the constant forces a
# visible change to this rule in the same commit.
#
# TWO TWINS, ONE LIST, AND THEY ARE ORDER-SENSITIVE HERE ON PURPOSE. The Worker's
# METADATA_PLACEHOLDER_NAMES (src/actuate.ts) and the orchestrator's GCP_METADATA_PLACEHOLDERS
# (src/agency-dispatch.ts) must agree; a reorder is harmless at runtime but is still an edit to a
# security boundary, and flagging it costs nothing. Both repos carry this rule, matching both
# names, so the constant is pinned wherever it is pasted.
rules:
  - id: dy-gcp-metadata-placeholder-allowlist-pinned
    message: >-
      The agency Worker's metadata placeholder allowlist is no longer exactly the five
      @@DY_T2_S3_*@@ names. This list is the security boundary of the Direction-B credential
      path: the Worker substitutes its OWN secrets for exactly these tokens and refuses every
      other @@...@@, which is what keeps the platform from ever holding the agency's
      object-store credential. Another name is another agency secret spliced into a script
      Google runs as root on every boot — a decision, not a one-line edit (planning/47 §1).
      Change the Worker's METADATA_PLACEHOLDER_NAMES and the orchestrator's
      GCP_METADATA_PLACEHOLDERS together, and say why.
    # WARNING, not ERROR, per the planning/45 rollout convention: a new rule lands reporting,
    # not gating, so CI is not red on day one. The CI gate is on the rule TESTS passing; the
    # full scan is reported under continue-on-error.
    severity: WARNING
    languages: [typescript]
    paths:
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
    patterns:
      - pattern-either:
          - pattern: const METADATA_PLACEHOLDER_NAMES = $LIST;
          - pattern: const GCP_METADATA_PLACEHOLDERS = $LIST;
      # One declaration carries one name, so the other exclusion is vacuous for it. Both are
      # listed so the rule text is identical in both repos.
      - pattern-not: |
          const METADATA_PLACEHOLDER_NAMES = [
            "@@DY_T2_S3_ACCESS_KEY_ID@@",
            "@@DY_T2_S3_SECRET_ACCESS_KEY@@",
            "@@DY_T2_S3_ENDPOINT@@",
            "@@DY_T2_S3_BUCKET@@",
            "@@DY_T2_S3_REGION@@",
          ] as const;
      - pattern-not: |
          const GCP_METADATA_PLACEHOLDERS = [
            "@@DY_T2_S3_ACCESS_KEY_ID@@",
            "@@DY_T2_S3_SECRET_ACCESS_KEY@@",
            "@@DY_T2_S3_ENDPOINT@@",
            "@@DY_T2_S3_BUCKET@@",
            "@@DY_T2_S3_REGION@@",
          ] as const;
