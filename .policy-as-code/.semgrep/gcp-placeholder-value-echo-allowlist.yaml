# The placeholder-VALUE echo allowlist, pinned to its approved four names.
#
# WHAT THE LIST IS. The agency Worker substitutes its own S3_* secrets for six `@@...@@` placeholders
# in a cell node's root boot script (see gcp-metadata-placeholder-allowlist.yaml next door). It then
# reports back which placeholders it filled — and, since hub#64, what four of them RESOLVED TO. This
# list is which four. Everything not on it is omitted from the response entirely: not masked, not
# truncated, absent.
#
# WHY THE VALUES ARE REPORTED AT ALL. "The placeholder was substituted" says nothing about WHAT it
# resolved to, and the difference is not academic. `@@DY_T1_S3_BUCKET@@` reads the OPTIONAL
# S3_BACKUP_BUCKET secret and falls back to S3_BUCKET when it is unset. On 2026-10-06 that secret
# never reached an agency's Worker: the placeholder was reported as substituted, the provisioning run
# reported ok, and Tier-1 went on writing into the locked Tier-2 bucket where restic cannot remove its
# own lock — found by an SSH session and an mtime comparison, not by any control-plane check.
#
# WHAT A FIFTH NAME COSTS. Adding one is how a secret leaks out of this Worker. The two names that
# are deliberately NOT here are `@@DY_T2_S3_ACCESS_KEY_ID@@` and `@@DY_T2_S3_SECRET_ACCESS_KEY@@` —
# both halves of the agency's object-store credential, which under Direction-B the platform must
# never hold. An access key id is not "just an identifier": it is half of a credential and a
# long-lived name for the agency's store. The four that ARE here are two bucket names, an endpoint
# host and an AWS region.
#
# WHY A PINNED LITERAL. "Is this value a secret?" is not a property a matcher can test — the approved
# list IS the policy. The rule holds a copy and flags every other value, so widening it forces a
# visible change to this rule in the same commit.
#
# TWO TWINS, ONE LIST. The Worker's PLACEHOLDER_VALUES_SAFE_TO_ECHO (src/actuate.ts) decides what is
# SENT; the orchestrator's GCP_PLACEHOLDER_VALUES_SAFE_TO_ECHO (src/agency-dispatch.ts) decides what
# is ACCEPTED and shown — the platform filters as well as the Worker, because the Worker is the
# agency's own deployment and forks drift. Both repos carry this rule, matching both names, so the
# constant is pinned wherever it is pasted. Order is matched too: a reorder is harmless at runtime but
# is still an edit to a security boundary, and flagging it costs nothing.
rules:
  - id: dy-gcp-placeholder-value-echo-allowlist-pinned
    message: >-
      The placeholder-VALUE echo allowlist is no longer exactly the four non-secret names
      (@@DY_T1_S3_BUCKET@@, @@DY_T2_S3_BUCKET@@, @@DY_T2_S3_ENDPOINT@@, @@DY_T2_S3_REGION@@).
      This list decides which resolved values leave the agency Worker and which the platform will
      show an operator. Adding a name is how a secret leaks: @@DY_T2_S3_ACCESS_KEY_ID@@ and
      @@DY_T2_S3_SECRET_ACCESS_KEY@@ are both halves of the agency's object-store credential, which
      Direction-B says the platform never holds. Change the Worker's
      PLACEHOLDER_VALUES_SAFE_TO_ECHO and the orchestrator's GCP_PLACEHOLDER_VALUES_SAFE_TO_ECHO
      together, and say why (hub#64).
    # WARNING, not ERROR, per the planning/45 rollout convention: a new rule lands reporting,
    # not gating, so CI is not red on day one. The CI gate is on the rule TESTS passing; the
    # full scan is reported under continue-on-error.
    severity: WARNING
    languages: [typescript]
    paths:
      exclude:
        - "*.test.ts"
        - "*.test.tsx"
    patterns:
      - pattern-either:
          - pattern: const PLACEHOLDER_VALUES_SAFE_TO_ECHO = $LIST;
          - pattern: const GCP_PLACEHOLDER_VALUES_SAFE_TO_ECHO = $LIST;
      # One declaration carries one name, so the other exclusion is vacuous for it. Both are
      # listed so the rule text is identical in both repos.
      - pattern-not: |
          const PLACEHOLDER_VALUES_SAFE_TO_ECHO = [
            "@@DY_T1_S3_BUCKET@@",
            "@@DY_T2_S3_BUCKET@@",
            "@@DY_T2_S3_ENDPOINT@@",
            "@@DY_T2_S3_REGION@@",
          ] as const;
      - pattern-not: |
          const GCP_PLACEHOLDER_VALUES_SAFE_TO_ECHO = [
            "@@DY_T1_S3_BUCKET@@",
            "@@DY_T2_S3_BUCKET@@",
            "@@DY_T2_S3_ENDPOINT@@",
            "@@DY_T2_S3_REGION@@",
          ] as const;
